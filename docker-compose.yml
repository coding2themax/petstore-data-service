services:
  app:
    image: "pet-data-service"
    build:
      context: .
    container_name: app
    environment:
      AWS_REGION: us-east-1
      DYNAMODB_ENDPOINT: "http://dynamodb:8000"
      # DynamoDB Local accepts any credentials
      DYNAMODB_ACCESS_KEY_ID: local
      DYNAMODB_SECRET_ACCESS_KEY: local
      DYNAMODB_CREATE_TABLES: "true"
      DYNAMODB_SEED_DATA: "true"
    ports:
      - "8080:8080"
    restart: always
    depends_on:
      - dynamodb
  dynamodb:
    image: amazon/dynamodb-local:3.3.1
    # the data volume is owned by root, so DynamoDB Local must run as root to write to it
    user: root
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    ports:
      - "8000:8000"

volumes:
  dynamodb-data:
